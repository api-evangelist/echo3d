server:
  name: echo3d
  description: >-
    The echo3D Model Context Protocol (MCP) server lets any MCP-compatible AI
    client (Claude, ChatGPT, Gemini, Cursor, and others) manage an echo3D 3D
    collection using natural language.
  connection: >-
    Connect an AI client by following the setup instructions on the MCP Server
    page inside the echo3D console (console.echo3d.com); the console generates
    the client configuration bound to your collection.
