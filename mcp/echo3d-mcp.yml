- name: list_assets
  description: List assets in the connected echo3D collection.
- name: upload_asset
  description: Upload a new 3D asset to the collection.
- name: convert_asset
  description: Convert an asset to a different 3D file format.
- name: compress_asset
  description: Compress/optimize an asset.
- name: tag_asset
  description: Add tags/metadata to an asset.
- name: search_assets
  description: Search assets across the collection.
notes: >-
