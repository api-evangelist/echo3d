aid: echo3d
name: echo3D
description: >-
  echo3D is a cloud-based 3D digital asset management (DAM) platform that lets
  enterprises and development teams store, secure, optimize, convert, version,
  and share 3D models, animations, scans, and interactive AR/VR content across
  their organization and beyond. It exposes a RESTful HTTP API at
  api.echo3d.com for uploading, querying, downloading, converting, compressing,
  organizing, and deleting 3D content entries in collections, plus first-party
  SDKs and plugins for Unity, Unreal Engine, Swift/iOS, JavaScript/web, React,
  React Native, Flutter, Python, Blender, NVIDIA Omniverse, Adobe Substance 3D,
  and Autodesk 3ds Max. The platform adds event webhooks, an MCP server for AI
  clients, AI agents for deduplication and watermarking, WebAR delivery, and
  cross-platform 3D content optimization.
